{# Reusable password input with show/hide toggle (login + admin account forms). #}
{% macro password_input(input_id, name='password', autocomplete='new-password', required=true) -%}
<span class="password-reveal-wrap">
  <input
    id="{{ input_id }}"
    name="{{ name }}"
    type="password"
    autocomplete="{{ autocomplete }}"
    {% if required %}required{% endif %}
  >
  <button
    type="button"
    class="password-reveal-toggle"
    aria-label="Show password"
    aria-pressed="false"
    aria-controls="{{ input_id }}"
  >
    <svg class="password-reveal-icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
    <svg class="password-reveal-icon-hide is-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 3l18 18"/>
      <path d="M10.6 10.6a3 3 0 1 0 4.2 4.2"/>
      <path d="M9.5 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.1 3.1"/>
      <path d="M6.1 6.1C3.9 7.6 2 12 2 12s3.5 7 10 7a10.8 10.8 0 0 0 4.4-.9"/>
    </svg>
  </button>
</span>
{%- endmacro %}
