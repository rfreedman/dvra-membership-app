<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/style.css">
  {{ extra_head_html|safe }}
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <div class="site-header-brand-row">
      <a href="{{ url_for('/') }}" aria-label="DVRA Membership Manager home">
        <img class="site-header-logo" src="/static/w2zq-site-icon-gold.png" alt="" width="48" height="48">
      </a>
      <div class="site-header-title-block">
        <h1><a href="{{ url_for('/') }}">DVRA Membership Manager</a><span class="site-header-version">v{{ app_version }}</span></h1>
      </div>
    </div>
    <nav class="site-nav">
      {% if authenticated %}
      <a href="{{ url_for('/') }}" class="{{ 'active' if active_nav == 'members' else '' }}">Members</a>
      <a href="{{ url_for('/reports') }}" class="{{ 'active' if active_nav == 'reports' else '' }}">Reports</a>
      {% if is_admin %}
      <a href="{{ url_for('/admin') }}" class="{{ 'active' if active_nav == 'admin' else '' }}">Admin</a>
      {% endif %}
      <form class="logout-form" method="post" action="{{ url_for('/logout') }}">
        <button type="submit">Logout</button>
      </form>
      {% endif %}
    </nav>
  </div>
</header>
<main class="site-main">
  {{ content_html|safe }}
</main>
<script src="/static/scroll-panels.js"></script>
<script src="/static/export-links.js"></script>
{{ extra_scripts_html|safe }}
<script>
(function () {
  function alignHeaderVersion() {
    var titleLink = document.querySelector(".site-header-brand-row h1 a");
    var version = document.querySelector(".site-header-version");
    if (!titleLink || !version) {
      return;
    }
    version.style.marginLeft = "";
    version.style.position = "";
    version.style.top = "";
    var linkRange = document.createRange();
    linkRange.selectNodeContents(titleLink);
    var linkRects = Array.prototype.filter.call(linkRange.getClientRects(), function (rect) {
      return rect.width > 0 && rect.height > 0;
    });
    if (!linkRects.length) {
      return;
    }
    var lastLine = linkRects[linkRects.length - 1];
    var titleRight = lastLine.right;
    for (var i = 0; i < linkRects.length; i++) {
      if (linkRects[i].right > titleRight) {
        titleRight = linkRects[i].right;
      }
    }
    var versionRect = version.getBoundingClientRect();
    var versionMid = (versionRect.top + versionRect.bottom) / 2;
    var sameLine = versionMid >= lastLine.top && versionMid <= lastLine.bottom;
    if (sameLine) {
      return;
    }
    var marginLeft = parseFloat(getComputedStyle(version).marginLeft) || 0;
    var delta = titleRight - versionRect.right;
    if (Math.abs(delta) >= 0.5) {
      version.style.marginLeft = (marginLeft + delta) + "px";
      versionRect = version.getBoundingClientRect();
    }
    var desiredGap = (parseFloat(getComputedStyle(version).fontSize) || 0) / 2;
    var gapDelta = (lastLine.bottom + desiredGap) - versionRect.top;
    if (Math.abs(gapDelta) >= 0.5) {
      version.style.position = "relative";
      version.style.top = gapDelta + "px";
    }
  }

  alignHeaderVersion();
  window.addEventListener("resize", alignHeaderVersion);
})();
</script>
</body>
</html>
