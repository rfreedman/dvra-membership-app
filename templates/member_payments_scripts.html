<script>
(function () {
  const openBtn = document.getElementById("open-add-payment");
  const addDialog = document.getElementById("add-payment-dialog");
  const cancelBtn = document.getElementById("cancel-add-payment");
  if (openBtn && addDialog && typeof addDialog.showModal === "function") {
    openBtn.addEventListener("click", function () {
      addDialog.showModal();
    });
  }
  if (cancelBtn && addDialog) {
    cancelBtn.addEventListener("click", function () {
      addDialog.close();
    });
  }

  const inputs = document.querySelectorAll(".payment-row-input");
  for (let i = 0; i < inputs.length; i++) {
    inputs[i].addEventListener("change", function () {
      const input = this;
      if (input.form) {
        input.form.requestSubmit();
      }
    });
  }
})();
</script>
