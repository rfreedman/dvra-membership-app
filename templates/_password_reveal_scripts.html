<script>
(function () {
  document.querySelectorAll(".password-reveal-toggle").forEach(function (toggle) {
    const inputId = toggle.getAttribute("aria-controls");
    const password = inputId ? document.getElementById(inputId) : null;
    if (!password) return;
    const iconShow = toggle.querySelector(".password-reveal-icon-show");
    const iconHide = toggle.querySelector(".password-reveal-icon-hide");
    toggle.addEventListener("click", function () {
      const show = password.type === "password";
      password.type = show ? "text" : "password";
      toggle.setAttribute("aria-pressed", show ? "true" : "false");
      toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
      if (iconShow) iconShow.classList.toggle("is-hidden", show);
      if (iconHide) iconHide.classList.toggle("is-hidden", !show);
    });
  });
})();
</script>
