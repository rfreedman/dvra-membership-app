{% from '_password_field.html' import password_input %}
<div class="grid-page">
<div class="grid-page-top"><h2>Login</h2></div>
<div class="grid-page-body standard-page-scroll" style="height:auto;">
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post" action="{{ url_for('/login') }}" class="stacked-form login-form">
  <label for="login-username">Username
    <input id="login-username" name="username" required autocomplete="username">
  </label>
  <label for="login-password">Password
    {{ password_input('login-password', autocomplete='current-password') }}
  </label>
  <button type="submit">Sign in</button>
</form>
</div>
</div>
{% include "_password_reveal_scripts.html" %}
