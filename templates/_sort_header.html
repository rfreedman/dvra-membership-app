{% macro sortable_th(field, label, current_sort_by, current_sort_dir, next_choices, form_action) -%}
{% set choice = next_choices.get(field, {'sort_by': current_sort_by, 'sort_dir': current_sort_dir}) %}
<th scope="col" class="report-sort-th"{% if current_sort_by == field %} aria-sort="{{ 'ascending' if current_sort_dir == 'asc' else 'descending' }}"{% endif %}><form method="post" action="{{ form_action }}" class="report-sort-form"><input type="hidden" name="sort_by" value="{{ choice.sort_by }}"><input type="hidden" name="sort_dir" value="{{ choice.sort_dir }}"><button type="submit" class="report-sort-hit" aria-label="Sort by {{ label }}{% if current_sort_by == field %}, currently sorted {{ 'ascending' if current_sort_dir == 'asc' else 'descending' }}{% else %}, activate to sort{% endif %}"><span class="report-sort-label">{{ label }}</span><span class="report-sort-sorter" aria-hidden="true"><span class="dvra-sorter-arrow"></span></span></button></form></th>
{%- endmacro %}
