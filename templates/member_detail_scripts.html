<script>
(function () {
  const UNSAVED_MSG = "You have unsaved changes to this member. Leave without saving?";
  const LEAVE_MSG = "You have unsaved changes to this member. Leave this page without saving?";

  function formSnapshot(form) {
    const fd = new FormData(form);
    const pairs = [];
    fd.forEach(function (val, key) {
      pairs.push(key + "\0" + val);
    });
    pairs.sort();
    return pairs.join("\n");
  }

  document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("member-edit-form");
    const saveBtn = document.getElementById("member-edit-save");
    const deleteForm = document.getElementById("member-delete-form");
    if (!form || !saveBtn) {
      return;
    }

    const baseline = formSnapshot(form);
    let allowLeaveWithoutPrompt = false;
    let forceDeleteSubmit = false;

    function isDirty() {
      return formSnapshot(form) !== baseline;
    }

    function syncSaveState() {
      saveBtn.disabled = !isDirty();
    }

    form.addEventListener("input", syncSaveState);
    form.addEventListener("change", syncSaveState);
    syncSaveState();

    form.addEventListener("submit", function (e) {
      const newHamId = form.getAttribute("data-new-ham-id") || "";
      const initial = form.getAttribute("data-initial-membership") || "";
      const select = document.getElementById("edit-membership");
      const chosen = select ? String(select.value || "") : "";
      if (newHamId && chosen === newHamId && initial !== newHamId) {
        const msg = form.getAttribute("data-new-ham-confirm") || "Change this member to New Ham?";
        if (!window.confirm(msg)) {
          e.preventDefault();
          return;
        }
      }
      allowLeaveWithoutPrompt = true;
    });

    window.addEventListener("beforeunload", function (e) {
      if (allowLeaveWithoutPrompt || !isDirty()) {
        return;
      }
      e.preventDefault();
      e.returnValue = LEAVE_MSG;
      return LEAVE_MSG;
    });

    document.querySelectorAll(".member-detail-page a.member-edit-leave-risk").forEach(function (a) {
      const href = a.getAttribute("href");
      if (!href) {
        return;
      }
      a.addEventListener("click", function (e) {
        if (!isDirty()) {
          return;
        }
        e.preventDefault();
        if (!window.confirm(UNSAVED_MSG)) {
          return;
        }
        allowLeaveWithoutPrompt = true;
        window.location.href = href;
      });
    });

    if (deleteForm) {
      const deleteMsg = deleteForm.getAttribute("data-confirm-delete") || "Delete this member and all payments?";
      deleteForm.addEventListener("submit", function (e) {
        if (forceDeleteSubmit) {
          return;
        }
        e.preventDefault();
        if (!window.confirm(deleteMsg)) {
          return;
        }
        allowLeaveWithoutPrompt = true;
        forceDeleteSubmit = true;
        deleteForm.submit();
      });
    }
  });
})();
</script>
