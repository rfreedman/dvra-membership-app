<script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.2/dist/js/tabulator.min.js"></script>
<script>
(function () {
  const MEMBERS_DATA = {{ members_json|safe }};
  const SERVER_SORT_BY = {{ sort_by|tojson }};
  const SERVER_SORT_DIR = {{ sort_dir|tojson }};
  const APP_BASE = {{ base|tojson }};
  const MEMBERS_SORT_TOUCH_URL = {{ members_sort_touch_url|tojson }};
  const MEMBERS_NOTE_URL_PREFIX = {{ members_note_url_prefix|tojson }};

  const dash = "—";
  const form = document.getElementById("members-filter-form");
  const currentOnlyField = document.getElementById("members-current-only-field");
  const currentOnlyCb = document.getElementById("members-current-only-cb");
  const includeDeceasedField = document.getElementById("members-include-deceased-field");
  const includeDeceasedCb = document.getElementById("members-include-deceased-cb");
  const noteDialog = document.getElementById("member-note-dialog");
  const noteTitle = document.getElementById("member-note-dialog-title");
  const noteError = document.getElementById("member-note-dialog-error");
  const noteTextarea = document.getElementById("member-note-textarea");
  const noteSave = document.getElementById("member-note-save");
  const noteClear = document.getElementById("member-note-clear");
  const noteCancel = document.getElementById("member-note-cancel");
  let noteMemberId = 0;

  function syncCurrentOnlyHiddenFromCheckbox() {
    currentOnlyField.value = currentOnlyCb.checked ? "yes" : "no";
  }

  function syncIncludeDeceasedHiddenFromCheckbox() {
    if (!includeDeceasedField || !includeDeceasedCb) return;
    includeDeceasedField.value = includeDeceasedCb.checked ? "yes" : "no";
  }

  function syncExportLinks() {
    if (typeof window.dvraSyncExportLinks === "function") {
      window.dvraSyncExportLinks();
    }
  }

  function noteUrl(id) {
    return MEMBERS_NOTE_URL_PREFIX + "/" + id + "/note";
  }

  function setNoteError(msg) {
    if (!noteError) return;
    if (msg) {
      noteError.textContent = msg;
      noteError.hidden = false;
    } else {
      noteError.textContent = "";
      noteError.hidden = true;
    }
  }

  function updateRowHasNote(id, hasNote) {
    const rows = table.getRows ? table.getRows() : [];
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const data = row.getData();
      if (Number(data.id) !== Number(id)) continue;
      const done = function () {
        if (typeof row.reformat === "function") row.reformat();
      };
      const updated = row.update({ has_note: !!hasNote });
      if (updated && typeof updated.then === "function") {
        updated.then(done);
      } else {
        done();
      }
      return;
    }
  }

  async function openMemberNote(id, fallbackLabel) {
    if (!noteDialog || typeof noteDialog.showModal !== "function") {
      return;
    }
    noteMemberId = id;
    setNoteError("");
    noteTextarea.value = "";
    noteTitle.textContent = fallbackLabel || "Member note";
    noteDialog.showModal();
    try {
      const resp = await fetch(noteUrl(id), {
        method: "GET",
        credentials: "same-origin",
        headers: { Accept: "application/json" },
      });
      if (!resp.ok) {
        setNoteError("Could not load note.");
        return;
      }
      const data = await resp.json();
      noteTitle.textContent = data.label || fallbackLabel || "Member note";
      noteTextarea.value = data.notes || "";
    } catch (e) {
      setNoteError("Could not load note.");
    }
  }

  async function saveMemberNote(notes) {
    setNoteError("");
    const body = new URLSearchParams();
    body.set("notes", notes);
    try {
      const resp = await fetch(noteUrl(noteMemberId), {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
          Accept: "application/json",
        },
        body: body.toString(),
      });
      if (!resp.ok) {
        setNoteError("Could not save note.");
        return false;
      }
      const data = await resp.json();
      updateRowHasNote(noteMemberId, !!data.has_note);
      return true;
    } catch (e) {
      setNoteError("Could not save note.");
      return false;
    }
  }

  async function persistClientSortThenSyncExports() {
    const sorters =
      typeof table.getSorters === "function" ? table.getSorters() : [];
    if (!sorters || sorters.length === 0 || !MEMBERS_SORT_TOUCH_URL) {
      syncExportLinks();
      return;
    }
    const body = new URLSearchParams();
    body.set("sort_by", String(sorters[0].field));
    body.set("sort_dir", String(sorters[0].dir));
    try {
      await fetch(MEMBERS_SORT_TOUCH_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body.toString(),
        credentials: "same-origin",
      });
    } catch (e) {
      /* non-fatal */
    }
    syncExportLinks();
  }

  const table = new Tabulator("#members-grid", {
    data: MEMBERS_DATA,
    layout: "fitColumns",
    height: "100%",
    placeholder: "No members match the current filters.",
    columns: [
      {
        title: "Actions",
        field: "id",
        sortable: false,
        headerSort: false,
        hozAlign: "left",
        width: 220,
        cssClass: "members-tabulator-actions",
        formatter: function (cell) {
          const row = cell.getRow().getData();
          const id = Number(row.id);
          if (!Number.isFinite(id) || id <= 0) return "";
          const viewHref = APP_BASE + "/members/" + id + "/view";
          const payHref = APP_BASE + "/members/" + id + "/payments";
          const hasNote = !!row.has_note;
          const noteClass = hasNote
            ? "btn-primary members-note-btn members-note-btn--has"
            : "btn-primary members-note-btn";
          return (
            '<a class="btn-primary" href="' + viewHref + '">Edit</a>&nbsp;' +
            '<a class="btn-primary" href="' + payHref + '">Payments</a>&nbsp;' +
            '<button type="button" class="' + noteClass + '" data-member-id="' + id + '">Notes</button>'
          );
        },
        cellClick: function (e, cell) {
          const btn = e.target.closest(".members-note-btn");
          if (!btn) return;
          e.preventDefault();
          e.stopPropagation();
          const row = cell.getRow().getData();
          const id = Number(btn.getAttribute("data-member-id") || row.id);
          const label =
            (row.last_name || "") +
            ", " +
            (row.first_name || "") +
            (row.call_sign ? " (" + row.call_sign + ")" : "");
          void openMemberNote(id, label);
        },
      },
      {
        title: "Call sign",
        field: "call_sign",
        sorter: "string",
        width: 91,
        formatter: (cell) => (cell.getValue() ? cell.getValue() : dash),
      },
      {
        title: "Last name",
        field: "last_name",
        sorter: "string",
        width: 151,
      },
      {
        title: "First name",
        field: "first_name",
        sorter: "string",
        width: 161,
      },
      {
        title: "Nickname",
        field: "nickname",
        sorter: "string",
        width: 120,
        formatter: (cell) => (cell.getValue() ? cell.getValue() : dash),
      },
      {
        title: "Date paid",
        field: "date_paid",
        sorter: "string",
        width: 125,
        cssClass: "members-col-fixed-data",
        formatter: (cell) => cell.getValue() || "",
      },
      {
        title: "Paid through",
        field: "paid_through",
        sorter: "string",
        width: 125,
        cssClass: "members-col-fixed-data",
        formatter: (cell) => cell.getValue() || "",
      },
      {
        title: "Email",
        field: "email",
        sorter: "string",
        width: 230,
      },
      {
        title: "QRZ email",
        field: "qrz_email",
        sorter: "string",
        width: 230,
        formatter: (cell) => (cell.getValue() ? cell.getValue() : dash),
      },
      {
        title: "Phone",
        field: "phone",
        sorter: "string",
        width: 130,
        cssClass: "members-col-fixed-data",
      },
      {
        title: "Street",
        field: "address_street",
        sorter: "string",
        width: 170,
        formatter: (cell) => (cell.getValue() ? cell.getValue() : dash),
      },
      {
        title: "City",
        field: "address_city",
        sorter: "string",
        width: 98,
        formatter: (cell) => (cell.getValue() ? cell.getValue() : dash),
      },
      {
        title: "State",
        field: "address_state",
        sorter: "string",
        width: 95,
        cssClass: "members-col-fixed-data",
        hozAlign: "center",
        formatter: (cell) => (cell.getValue() ? cell.getValue() : dash),
      },
      {
        title: "ZIP",
        field: "address_zip",
        sorter: "string",
        width: 114,
        cssClass: "members-col-fixed-data",
        formatter: (cell) => (cell.getValue() ? cell.getValue() : dash),
      },
      {
        title: "License class",
        field: "license_class",
        sorter: "string",
        width: 153,
        cssClass: "members-col-ref-data",
      },
      {
        title: "Membership type",
        field: "membership_type",
        sorter: "string",
        width: 176,
        cssClass: "members-col-ref-data",
      },
      {
        title: "Covered by",
        field: "covered_by",
        sorter: "string",
        width: 200,
        cssClass: "members-col-ref-data",
        formatter: (cell) => (cell.getValue() ? cell.getValue() : dash),
      },
      {
        title: "ARRL",
        field: "arrl_member",
        sorter: "boolean",
        width: 88,
        cssClass: "members-col-ref-data",
        hozAlign: "center",
        formatter: (cell) => (cell.getValue() ? "yes" : "no"),
      },
      {
        title: "SK",
        field: "deceased",
        sorter: "boolean",
        width: 108,
        cssClass: "members-col-ref-data",
        hozAlign: "center",
        formatter: (cell) => (cell.getValue() ? "yes" : "no"),
      },
    ],
    initialSort: [{ column: SERVER_SORT_BY, dir: SERVER_SORT_DIR }],
  });

  if (noteSave) {
    noteSave.addEventListener("click", async function () {
      const ok = await saveMemberNote(noteTextarea.value);
      if (ok && noteDialog) noteDialog.close();
    });
  }
  if (noteClear) {
    noteClear.addEventListener("click", async function () {
      if (!window.confirm("Clear this member note?")) return;
      noteTextarea.value = "";
      const ok = await saveMemberNote("");
      if (ok && noteDialog) noteDialog.close();
    });
  }
  if (noteCancel && noteDialog) {
    noteCancel.addEventListener("click", function () {
      noteDialog.close();
    });
  }

  form.addEventListener("submit", function () {
    syncCurrentOnlyHiddenFromCheckbox();
    syncIncludeDeceasedHiddenFromCheckbox();
    const sorters = table.getSorters();
    if (sorters && sorters.length > 0) {
      form.querySelector('[name="sort_by"]').value = sorters[0].field;
      form.querySelector('[name="sort_dir"]').value = sorters[0].dir;
    }
    syncExportLinks();
  });

  currentOnlyCb.addEventListener("change", function () {
    syncCurrentOnlyHiddenFromCheckbox();
    form.requestSubmit();
  });
  if (includeDeceasedCb) {
    includeDeceasedCb.addEventListener("change", function () {
      syncIncludeDeceasedHiddenFromCheckbox();
      form.requestSubmit();
    });
  }

  function redrawMembersGrid() {
    table.redraw(true);
  }
  window.addEventListener("resize", redrawMembersGrid);
  window.requestAnimationFrame(redrawMembersGrid);

  if (typeof table.on === "function") {
    table.on("dataSorted", function () {
      const sorters = table.getSorters ? table.getSorters() : [];
      if (sorters && sorters.length > 0) {
        const sb = form.querySelector('[name="sort_by"]');
        const sd = form.querySelector('[name="sort_dir"]');
        if (sb) {
          sb.value = sorters[0].field;
        }
        if (sd) {
          sd.value = sorters[0].dir;
        }
      }
      void persistClientSortThenSyncExports();
    });
  }
  syncExportLinks();
})();
</script>
